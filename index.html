<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="도쿄 2026">
<meta id="metaThemeColor" name="theme-color" content="#1B365D">
<title>도쿄 4박 5일 여행계획표 (v5)</title>
<style>
  :root {
    --primary: #1B365D;
    --primary-light: #2E5B88;
    --header-bg: rgba(27, 54, 93, 0.96);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --sticky-bg: rgba(242, 244, 247, 0.94);
    --bg: #F2F4F7;
    --card: #FFFFFF;
    --note-bg: #F9FAFB;
    --note-border: #F3F4F6;
    --input-bg: #FFFFFF;
    --input-border: #D1D5DB;
    --text: #111827;
    --text-sub: #4B5563;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --divider: #F3F4F6;
    --alert-bg: #FFF4E5;
    --alert-border: #FDBA74;
    --alert-text: #9A3412;
    --alert-note-bg: rgba(255, 255, 255, 0.65);
    --green-bg: #DCFCE7;
    --green-text: #166534;
    --green-border: #86EFAC;
    --amber-bg: #FEF3C7;
    --amber-text: #92400E;
    --amber-border: #FCD34D;
    --grey-bg: #F3F4F6;
    --grey-text: #4B5563;
    --grey-border: #D1D5DB;
    --blue-bg: #DBEAFE;
    --blue-text: #1E40AF;
    --purple-bg: #F3E8FF;
    --purple-text: #6B21A8;
    --rose-bg: #FFE4E6;
    --rose-text: #9F1239;
    --navy-bg: #E2ECF5;
    --navy-text: #1B365D;
    --memo-bg: #FFFBEB;
    --memo-border: #FDE68A;
    --memo-text: #78350F;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Dark Theme Variables */
  [data-theme="dark"] {
    --primary: #60A5FA;
    --primary-light: #3B82F6;
    --header-bg: rgba(15, 23, 42, 0.96);
    --nav-bg: rgba(15, 23, 42, 0.96);
    --sticky-bg: rgba(11, 17, 32, 0.94);
    --bg: #0B1120;
    --card: #162033;
    --note-bg: #0F172A;
    --note-border: #1E293B;
    --input-bg: #0F172A;
    --input-border: #334155;
    --text: #F1F5F9;
    --text-sub: #CBD5E1;
    --text-muted: #94A3B8;
    --border: #253349;
    --divider: #1E293B;
    --alert-bg: #331B0E;
    --alert-border: #9A3412;
    --alert-text: #FDBA74;
    --alert-note-bg: rgba(15, 23, 42, 0.55);
    --green-bg: #123322;
    --green-text: #86EFAC;
    --green-border: #166534;
    --amber-bg: #33250B;
    --amber-text: #FCD34D;
    --amber-border: #854D0E;
    --grey-bg: #1E293B;
    --grey-text: #CBD5E1;
    --grey-border: #334155;
    --blue-bg: #172B4D;
    --blue-text: #93C5FD;
    --purple-bg: #2E1A47;
    --purple-text: #D8B4FE;
    --rose-bg: #3D1422;
    --rose-text: #FDA4AF;
    --navy-bg: #1E3352;
    --navy-text: #93C5FD;
    --memo-bg: #2B210B;
    --memo-border: #713F12;
    --memo-text: #FDE68A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  /* Header */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    max-width: 640px;
    margin: 0 auto;
  }
  .header-text { min-width: 0; }
  .app-header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .app-header .sub {
    margin-top: 2px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.78);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .hdr-btn {
    height: 34px;
    padding: 0 10px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.24);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .hdr-btn:active { opacity: 0.78; }

  /* Main Container */
  .main {
    max-width: 640px;
    margin: 0 auto;
    padding: 12px 14px calc(86px + var(--safe-bottom));
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Section Title */
  .sec-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    margin: 18px 2px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sec-title:first-child { margin-top: 4px; }

  /* Cards */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card.alert-card {
    background: var(--alert-bg);
    border-color: var(--alert-border);
  }
  .card.alert-card .card-title { color: var(--alert-text); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text);
    word-break: keep-all;
  }
  .card-meta {
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .card-note {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-sub);
    background: var(--note-bg);
    padding: 8px 10px;
    border-radius: 9px;
    border: 1px solid var(--note-border);
    word-break: keep-all;
  }
  .card.alert-card .card-note {
    background: var(--alert-note-bg);
    border-color: var(--alert-border);
    color: var(--alert-text);
    font-weight: 600;
  }

  /* Saved Memo Display & Editor */
  .memo-display {
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 9px;
    background: var(--memo-bg);
    border: 1px solid var(--memo-border);
    color: var(--memo-text);
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .memo-editor {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .memo-textarea {
    width: 100%;
    min-height: 68px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    resize: vertical;
    outline: none;
  }
  .memo-textarea:focus { border-color: var(--primary); }
  .memo-editor-btns {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  /* Badges */
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .b-navy { background: var(--navy-bg); color: var(--navy-text); }
  .b-blue { background: var(--blue-bg); color: var(--blue-text); }
  .b-green { background: var(--green-bg); color: var(--green-text); }
  .b-amber { background: var(--amber-bg); color: var(--amber-text); }
  .b-purple { background: var(--purple-bg); color: var(--purple-text); }
  .b-rose { background: var(--rose-bg); color: var(--rose-text); }
  .b-grey { background: var(--grey-bg); color: var(--grey-text); }

  /* Action row */
  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--divider);
  }
  .action-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-map {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 36px;
    padding: 0 13px;
    border-radius: 10px;
    background: #1B365D;
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  [data-theme="dark"] .btn-map {
    background: #2563EB;
  }
  .btn-map:active { opacity: 0.82; }
  .btn-status, .btn-memo, .btn-sm {
    min-height: 36px;
    padding: 0 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    background: var(--card);
    color: var(--text-sub);
  }
  .btn-memo.has-memo {
    background: var(--memo-bg);
    border-color: var(--memo-border);
    color: var(--memo-text);
  }
  .btn-sm-primary {
    background: #1B365D;
    color: #fff;
    border-color: #1B365D;
  }
  [data-theme="dark"] .btn-sm-primary {
    background: #2563EB;
    border-color: #2563EB;
  }
  .st-done { background: var(--green-bg); color: var(--green-text); border-color: var(--green-border); }
  .st-plan { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber-border); }
  .st-skip { background: var(--grey-bg); color: var(--grey-text); border-color: var(--grey-border); }

  /* Filter Chips & Search */
  .sticky-controls {
    position: sticky;
    top: calc(56px + var(--safe-top));
    z-index: 30;
    background: var(--sticky-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    margin: -12px -14px 10px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    min-height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--input-border);
    background: var(--card);
    color: var(--text-sub);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .chip.active {
    background: #1B365D;
    color: #fff;
    border-color: #1B365D;
  }
  [data-theme="dark"] .chip.active {
    background: #2563EB;
    border-color: #2563EB;
  }
  .search-box {
    width: 100%;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    padding: 0 12px;
    font-size: 14px;
    margin-bottom: 8px;
    outline: none;
  }
  .search-box:focus { border-color: var(--primary); }
  .result-count {
    font-size: 12px;
    color: var(--text-muted);
    margin: 4px 2px 8px;
  }

  /* Summary KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .kpi .num { font-size: 19px; font-weight: 800; color: var(--primary); }
  .kpi .lbl { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  /* Progress Bar */
  .progress-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .progress-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 10px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #16A34A;
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  /* Checklist Item */
  .chk-card {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    cursor: pointer;
  }
  .chk-box {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 2px solid var(--text-muted);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    background: var(--card);
  }
  .chk-card.done .chk-box {
    background: #16A34A;
    border-color: #16A34A;
  }
  .chk-card.done .card-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  /* Route Row */
  .route-time {
    font-size: 15px;
    font-weight: 800;
    color: var(--primary);
    white-space: nowrap;
  }

  /* Reset Button */
  .btn-reset {
    width: 100%;
    min-height: 40px;
    margin-top: 8px;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--card);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Bottom Tab Bar */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    background: var(--nav-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 6px 4px calc(6px + var(--safe-bottom));
  }
  .nav-btn {
    border: none;
    background: none;
    padding: 4px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; }
  .nav-btn.active { color: var(--primary); }
  .nav-btn.active svg { stroke-width: 2.3; }

  /* Currency Modal (Bottom Sheet) */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.52);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    color: var(--text);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    padding: 16px 16px calc(20px + var(--safe-bottom));
    border-top: 1px solid var(--border);
    box-shadow: 0 -8px 28px rgba(0,0,0,0.22);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .modal-title { font-size: 16px; font-weight: 800; }
  .modal-close {
    border: none;
    background: var(--grey-bg);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .fx-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .fx-label { font-size: 13px; color: var(--text-sub); font-weight: 600; }
  .fx-rate-input {
    width: 110px;
    height: 36px;
    border-radius: 9px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    text-align: right;
    padding: 0 10px;
    font-size: 14px;
    font-weight: 700;
  }
  .fx-jpy-input {
    width: 100%;
    height: 46px;
    border-radius: 12px;
    border: 1.5px solid var(--primary);
    background: var(--input-bg);
    color: var(--text);
    padding: 0 14px;
    font-size: 20px;
    font-weight: 800;
    text-align: right;
    outline: none;
  }
  .fx-result-box {
    margin-top: 10px;
    padding: 14px;
    border-radius: 12px;
    background: var(--note-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .fx-krw {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
  }
  .fx-presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .fx-preset-btn {
    height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .fx-preset-btn:active { background: var(--grey-bg); }
  .fx-hint {
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div class="header-text">
      <h1 id="hdrTitle">도쿄 4박 5일 여행계획표</h1>
      <div class="sub" id="hdrSub">2026.12.05(토) ~ 12.09(수) · 호텔 그레이스리 타마치</div>
    </div>
    <div class="header-tools">
      <button class="hdr-btn" id="btnOpenFx" type="button" aria-label="환율 계산기">¥ 환율</button>
      <button class="hdr-btn" id="btnTheme" type="button" aria-label="테마 전환">자동</button>
    </div>
  </div>
</header>

<main class="main">
  <section id="tab-overview" class="tab-panel active"></section>
  <section id="tab-itinerary" class="tab-panel"></section>
  <section id="tab-dining" class="tab-panel"></section>
  <section id="tab-spots" class="tab-panel"></section>
  <section id="tab-routes" class="tab-panel"></section>
</main>

<nav class="bottom-nav" aria-label="하단 메뉴">
  <button class="nav-btn active" data-tab="overview">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>개요</span>
  </button>
  <button class="nav-btn" data-tab="itinerary">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span>일정</span>
  </button>
  <button class="nav-btn" data-tab="dining">
    <svg viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 3 3v8M7 3v7M10 3v7M17 3v18M17 3c2.5 0 4 2.2 4 5s-1.5 5-4 5"/></svg>
    <span>맛집·술</span>
  </button>
  <button class="nav-btn" data-tab="spots">
    <svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
    <span>쇼핑·관광</span>
  </button>
  <button class="nav-btn" data-tab="routes">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>이동·체크</span>
  </button>
</nav>

<!-- Currency Converter Bottom Sheet -->
<div class="modal-backdrop" id="fxModal" role="dialog" aria-modal="true" aria-labelledby="fxModalTitle">
  <div class="modal-sheet">

const STORAGE_KEY = "tokyo_202612_v5_state";
const LEGACY_KEY = "tokyo_202612_v4_state";

let savedState = {
  itinerary: {},
  dining: {},
  memos: {},
  checklist: {},
  theme: "auto",
  fxRate100: 930
};

try {
  const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    savedState = Object.assign(savedState, parsed);
    if (!savedState.memos) savedState.memos = {};
  }
} catch (e) {}

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState)); } catch (e) {}
}

function esc(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function catBadgeClass(cat) {
  if (cat.includes("식당")) return "b-rose";
  if (cat.includes("카페")) return "b-amber";
  if (cat.includes("이자카야")) return "b-purple";
  if (cat.includes("쇼핑") || cat.includes("소품")) return "b-blue";
  if (cat.includes("관광") || cat.includes("야경") || cat.includes("일루미")) return "b-green";
  return "b-navy";
}

function getItStatus(item) { return savedState.itinerary[item.id] || item.status; }
function getDnStatus(item) { return savedState.dining[item.id] || item.status; }
function getMemo(id) { return savedState.memos[id] || ""; }
function getCkDone(item) { return (item.id in savedState.checklist) ? savedState.checklist[item.id] : item.done; }

/* ---------------- THEME (AUTO / LIGHT / DARK) ---------------- */
const mediaDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
const THEME_LABELS = { auto: "자동", light: "라이트", dark: "다크" };

function applyTheme() {
  const mode = savedState.theme || "auto";
  const isDark = mode === "dark" || (mode === "auto" && mediaDark && mediaDark.matches);
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
  const meta = document.getElementById("metaThemeColor");
  if (meta) meta.setAttribute("content", isDark ? "#0F172A" : "#1B365D");
  const btn = document.getElementById("btnTheme");
  if (btn) btn.textContent = THEME_LABELS[mode] || "자동";
}

document.getElementById("btnTheme").addEventListener("click", () => {
  const order = ["auto", "dark", "light"];
  const cur = savedState.theme || "auto";
  savedState.theme = order[(order.indexOf(cur) + 1) % order.length];
  persist();
  applyTheme();
});

if (mediaDark && mediaDark.addEventListener) {
  mediaDark.addEventListener("change", () => {
    if ((savedState.theme || "auto") === "auto") applyTheme();
  });
}
applyTheme();

/* ---------------- CURRENCY CALCULATOR ---------------- */
const fxModal = document.getElementById("fxModal");
const fxRateInput = document.getElementById("fxRate");
const fxJpyInput = document.getElementById("fxJpy");
const fxKrwResult = document.getElementById("fxKrwResult");

fxRateInput.value = savedState.fxRate100 || 930;

function updateFxResult() {
  const rate100 = parseFloat(fxRateInput.value) || 0;
  const jpy = parseFloat(fxJpyInput.value) || 0;
  const krw = Math.round((jpy / 100) * rate100);
  fxKrwResult.textContent = krw.toLocaleString("ko-KR") + " 원";
}

fxRateInput.addEventListener("input", () => {
  const v = parseFloat(fxRateInput.value);
  if (v > 0) {
    savedState.fxRate100 = v;
    persist();
  }
  updateFxResult();
});
fxJpyInput.addEventListener("input", updateFxResult);

document.getElementById("btnOpenFx").addEventListener("click", () => {
  fxModal.classList.add("open");
  updateFxResult();
  setTimeout(() => fxJpyInput.focus(), 80);
});
document.getElementById("btnCloseFx").addEventListener("click", () => fxModal.classList.remove("open"));
fxModal.addEventListener("click", (e) => {
  if (e.target === fxModal) fxModal.classList.remove("open");
});

window.addFxJpy = function(delta) {
  const cur = parseFloat(fxJpyInput.value) || 0;
  fxJpyInput.value = cur + delta;
  updateFxResult();
};
window.clearFxJpy = function() {
  fxJpyInput.value = "";
  updateFxResult();
};

          <span class="badge ${f.alert ? 'b-rose' : 'b-green'}">${esc(f.status)}</span>
        </div>
        <div class="card-title">${esc(f.name).replace(/\n/g, ' ')}</div>
        <div class="card-meta"><strong>일시:</strong> ${esc(f.datetime).replace(/\n/g, ' ')}</div>
        <div class="card-meta"><strong>터미널/위치:</strong> ${esc(f.location)}</div>
        <div class="card-note">${esc(f.note)}</div>
        ${f.link ? `<div class="card-actions"><span></span><a class="btn-map" href="${esc(f.link)}" target="_blank" rel="noopener noreferrer">구글 지도 보기</a></div>` : ''}
      </div>
    `;
  });

  html += `<div class="sec-title">2. 계획 통합·조정 핵심 요약</div>`;
  DATA.adjustments.forEach(a => {
    html += `
      <div class="card">
        <div class="card-title">${esc(a.item)}</div>

  html += `<button class="btn-reset" onclick="resetAllState()">체크·방문 상태 및 메모 초기화</button>`;

/* ---------------- TAB 2: ITINERARY ---------------- */
let activeDay = "전체";
function renderItinerary() {
  const el = document.getElementById("tab-itinerary");
  const days = ["전체", "1일차", "2일차", "3일차", "4일차", "5일차"];
  const list = activeDay === "전체" ? DATA.itinerary : DATA.itinerary.filter(i => i.day === activeDay);

  let html = `
    <div class="sticky-controls">
      <div class="chip-row">
        ${days.map(d => `<button class="chip ${activeDay === d ? 'active' : ''}" onclick="setDayFilter('${d}')">${d}</button>`).join("")}
      </div>
    </div>
    <div class="result-count">총 ${list.length}개 일정 (상태 버튼 탭하여 변경, 자동 저장)</div>
  `;

  let lastDay = "";
  list.forEach(item => {
    if (item.day !== lastDay) {
      lastDay = item.day;
      html += `<div class="sec-title">${esc(item.day)} · ${esc(item.date)}</div>`;
    }
    const st = getItStatus(item);
    const stCls = st === "방문완료" ? "st-done" : (st === "대체/취소" ? "st-skip" : "st-plan");
    html += `
      <div class="card">
        <div class="badges">
          <span class="badge b-navy">${esc(item.time)}</span>
          <span class="badge b-grey">${esc(item.area)}</span>
          <span class="badge ${catBadgeClass(item.category)}">${esc(item.category)}</span>
        </div>
        <div class="card-title">${esc(item.name)}</div>
        <div class="card-meta"><strong>운영/참고:</strong> ${esc(item.hours)}</div>
        <div class="card-note">${esc(item.note)}</div>
        <div class="card-actions">
          <button class="btn-status ${stCls}" onclick="cycleItStatus('${item.id}')">${esc(st)}</button>
          ${item.link ? `<a class="btn-map" href="${esc(item.link)}" target="_blank" rel="noopener noreferrer">구글 지도</a>` : ''}
        </div>
      </div>
    `;
  });
  el.innerHTML = html;
}

window.setDayFilter = function(d) { activeDay = d; renderItinerary(); };
window.cycleItStatus = function(id) {
  const item = DATA.itinerary.find(i => i.id === id);
  const order = ["예정", "방문완료", "대체/취소"];
  const cur = getItStatus(item);
  savedState.itinerary[id] = order[(order.indexOf(cur) + 1) % order.length];
  persist();
  renderItinerary();
  renderOverview();
};

/* ---------------- TAB 3: DINING (59 PLACES + MEMO) ---------------- */
let dnCat = "전체";
let dnArea = "전체";
let dnQuery = "";
let dnOnlyConfirmed = false;
let dnOnlyMemo = false;
let editingMemoId = null;

function renderDining() {
  const el = document.getElementById("tab-dining");
  const cats = ["전체", "식당", "카페", "이자카야"];
  const areas = ["전체", ...Array.from(new Set(DATA.dining.map(d => d.area)))];

  const existingInput = document.getElementById("dnSearchInput");
  const keepFocus = existingInput && document.activeElement === existingInput;

  if (!existingInput) {
    el.innerHTML = `
      <div class="sticky-controls">
        <input id="dnSearchInput" class="search-box" type="search" placeholder="매장명, 권역, 메뉴, 내 메모 검색 (예: 긴자, 라멘, 심야)" value="${esc(dnQuery)}">
        <div class="chip-row" id="dnCatRow"></div>
        <div class="chip-row" id="dnAreaRow" style="margin-top:4px;"></div>
      </div>
      <div class="result-count" id="dnCount"></div>
      <div id="dnList"></div>
    `;
    document.getElementById("dnSearchInput").addEventListener("input", (e) => {
      dnQuery = e.target.value;
      updateDiningList();
    });
  }

  document.getElementById("dnCatRow").innerHTML =
    cats.map(c => `<button class="chip ${dnCat === c ? 'active' : ''}" onclick="setDnCat('${c}')">${c}</button>`).join("") +
    `<button class="chip ${dnOnlyConfirmed ? 'active' : ''}" onclick="toggleDnConfirmed()">확정만</button>` +
    `<button class="chip ${dnOnlyMemo ? 'active' : ''}" onclick="toggleDnMemo()">메모있음</button>`;

  document.getElementById("dnAreaRow").innerHTML =
    areas.map(a => `<button class="chip ${dnArea === a ? 'active' : ''}" onclick="setDnArea('${esc(a)}')">${esc(a)}</button>`).join("");

  updateDiningList();
  if (keepFocus) document.getElementById("dnSearchInput").focus();
}

function updateDiningList() {
  const q = dnQuery.trim().toLowerCase();
  const list = DATA.dining.filter(d => {
    if (dnCat !== "전체" && d.category !== dnCat) return false;
    if (dnArea !== "전체" && d.area !== dnArea) return false;
    if (dnOnlyConfirmed && getDnStatus(d) !== "확정") return false;
    if (dnOnlyMemo && !getMemo(d.id).trim()) return false;
    if (q) {
      const hay = `${d.name} ${d.area} ${d.category} ${d.day} ${d.note} ${d.hours} ${getMemo(d.id)}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById("dnCount").textContent = `검색 결과 ${list.length}곳 / 전체 ${DATA.dining.length}곳`;
  const container = document.getElementById("dnList");
  if (!list.length) {
    container.innerHTML = `<div class="card"><div class="card-meta">조건에 맞는 매장이 없습니다.</div></div>`;
    return;
  }
  container.innerHTML = list.map(d => {
    const st = getDnStatus(d);
    const stCls = st === "확정" ? "st-done" : (st === "보류" ? "st-skip" : "st-plan");
    const memo = getMemo(d.id);
    const isEditing = (editingMemoId === d.id);
    return `
      <div class="card">
        <div class="badges">
          <span class="badge ${catBadgeClass(d.category)}">${esc(d.category)}</span>
          <span class="badge b-navy">${esc(d.area)}</span>
          <span class="badge b-grey">${esc(d.day)}</span>
        </div>
        <div class="card-title">${d.no}. ${esc(d.name)}</div>
        <div class="card-meta"><strong>운영시간:</strong> ${esc(d.hours)}</div>
        <div class="card-note">${esc(d.note)}</div>
        ${memo && !isEditing ? `<div class="memo-display"><strong>메모:</strong> ${esc(memo)}</div>` : ''}
        ${isEditing ? `
          <div class="memo-editor">
            <textarea id="memoInput_${d.id}" class="memo-textarea" placeholder="추천 메뉴, 예약 시간, 웨이팅 메모 등을 입력하세요.">${esc(memo)}</textarea>
            <div class="memo-editor-btns">
              <button class="btn-sm" type="button" onclick="cancelMemo()">취소</button>
              <button class="btn-sm btn-sm-primary" type="button" onclick="saveMemo('${d.id}')">저장</button>
            </div>
          </div>
        ` : ''}
        <div class="card-actions">
          <div class="action-left">
            <button class="btn-status ${stCls}" type="button" onclick="cycleDnStatus('${d.id}')">${esc(st)}</button>
            <button class="btn-memo ${memo ? 'has-memo' : ''}" type="button" onclick="openMemo('${d.id}')">${memo ? '메모 수정' : '+ 메모'}</button>
          </div>
          <a class="btn-map" href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">구글 지도</a>
        </div>
      </div>
    `;
  }).join("");

  if (editingMemoId) {
    const ta = document.getElementById("memoInput_" + editingMemoId);
    if (ta) ta.focus();
  }
}

window.setDnCat = function(c) { dnCat = c; renderDining(); };
window.setDnArea = function(a) { dnArea = a; renderDining(); };
window.toggleDnConfirmed = function() { dnOnlyConfirmed = !dnOnlyConfirmed; renderDining(); };
window.toggleDnMemo = function() { dnOnlyMemo = !dnOnlyMemo; renderDining(); };
window.cycleDnStatus = function(id) {
  const item = DATA.dining.find(d => d.id === id);
  const order = ["후보", "확정", "보류"];
  const cur = getDnStatus(item);
  savedState.dining[id] = order[(order.indexOf(cur) + 1) % order.length];
  persist();
  updateDiningList();
  renderOverview();
};
window.openMemo = function(id) {
  editingMemoId = (editingMemoId === id) ? null : id;
  updateDiningList();
};
window.cancelMemo = function() {
  editingMemoId = null;
  updateDiningList();
};
window.saveMemo = function(id) {
  const ta = document.getElementById("memoInput_" + id);
  if (ta) {
    const val = ta.value.trim();
    if (val) savedState.memos[id] = val;
    else delete savedState.memos[id];
    persist();
  }
  editingMemoId = null;
  updateDiningList();
};

/* ---------------- TAB 4: SHOPPING & SIGHTSEEING ---------------- */
let spDay = "전체";
function renderSpots() {
  const el = document.getElementById("tab-spots");
  const days = ["전체", ...Array.from(new Set(DATA.spots.map(s => s.day)))];
  const list = spDay === "전체" ? DATA.spots : DATA.spots.filter(s => s.day === spDay);

  let html = `
    <div class="sticky-controls">
      <div class="chip-row">
        ${days.map(d => `<button class="chip ${spDay === d ? 'active' : ''}" onclick="setSpDay('${esc(d)}')">${esc(d)}</button>`).join("")}
      </div>
    </div>
    <div class="result-count">총 ${list.length}곳 (쇼핑·소품·주요 관광·12월 일루미네이션)</div>
  `;

  list.forEach(s => {
    html += `
      <div class="card">
        <div class="badges">
          <span class="badge b-navy">${esc(s.day)}</span>
          <span class="badge b-grey">${esc(s.area)}</span>
          <span class="badge ${catBadgeClass(s.category)}">${esc(s.category)}</span>
        </div>
        <div class="card-title">${esc(s.name)}</div>
        <div class="card-meta"><strong>타깃/볼거리:</strong> ${esc(s.target)}</div>
        ${s.note ? `<div class="card-note">${esc(s.note)}</div>` : ''}
        <div class="card-actions">
          <span></span>
          <a class="btn-map" href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">구글 지도</a>
        </div>
      </div>
    `;
  });
  el.innerHTML = html;
}
window.setSpDay = function(d) { spDay = d; renderSpots(); };

/* ---------------- TAB 5: ROUTES & CHECKLIST ---------------- */
function renderRoutes() {
  const el = document.getElementById("tab-routes");
  const doneCnt = DATA.checklist.filter(c => getCkDone(c)).length;
  const pct = Math.round((doneCnt / DATA.checklist.length) * 100);
  const cityRoutes = DATA.routes.slice(1, DATA.routes.length - 1);
  const avgCity = (cityRoutes.reduce((a, b) => a + b.mins, 0) / cityRoutes.length).toFixed(1);

  let html = `
    <div class="sec-title">1. 출발 전 필수 체크리스트</div>
    <div class="progress-wrap">
      <div class="progress-head"><span>준비 진행률 (${doneCnt} / ${DATA.checklist.length})</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
  `;

  DATA.checklist.forEach(c => {
    const done = getCkDone(c);
    html += `
      <div class="card chk-card ${done ? 'done' : ''}" onclick="toggleCheck('${c.id}')">
        <div class="chk-box">${done ? '✓' : ''}</div>
        <div style="flex:1; min-width:0;">
          <div class="badges">
            <span class="badge b-navy">${esc(c.when)}</span>
            <span class="badge b-grey">${esc(c.note)}</span>
          </div>
          <div class="card-title">${esc(c.item)}</div>
          <div class="card-meta">${esc(c.detail)}</div>
        </div>
      </div>
    `;
  });

  html += `
    <div class="sec-title">2. 주요 대중교통 이동 경로 <span>도심 평균 ${avgCity}분</span></div>
  `;
  DATA.routes.forEach(r => {
    html += `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="badges">
              <span class="badge b-navy">${esc(r.day)}</span>
              <span class="badge b-grey">${esc(r.note)}</span>
            </div>
            <div class="card-title">${esc(r.origin)} → ${esc(r.dest)}</div>
          </div>
          <div class="route-time">${r.mins}분</div>
        </div>
        <div class="card-note">${esc(r.summary)}</div>
      </div>
    `;
  });

  el.innerHTML = html;
}

window.toggleCheck = function(id) {
  const item = DATA.checklist.find(c => c.id === id);
  savedState.checklist[id] = !getCkDone(item);
  persist();
  renderRoutes();
  renderOverview();
};

window.resetAllState = function() {
  if (!confirm("저장된 방문 상태, 메모, 체크리스트를 모두 초기화할까요?")) return;
  savedState = { itinerary: {}, dining: {}, memos: {}, checklist: {}, theme: savedState.theme, fxRate100: savedState.fxRate100 };
  persist();
  editingMemoId = null;
  renderOverview();
  renderItinerary();
  renderDining();
  renderRoutes();
};

/* ---------------- NAVIGATION ---------------- */
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = btn.dataset.tab;
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + target));
    window.scrollTo({ top: 0, behavior: "instant" });
  });
});

renderOverview();
renderItinerary();
renderDining();
renderSpots();
renderRoutes();
</script>
</body>
</html>
